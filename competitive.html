<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axiom-Apps — Competitive Intelligence</title>
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<meta name="CCBot" content="noindex, nofollow">
<meta name="GPTBot" content="noindex, nofollow">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --axiom-blue: #1A5C86;
    --deep-navy: #0F3750;
    --signal-amber: #D9772B;
    --navy-900: #0F3750;
    --blue-700: #1A5C86;
    --blue-500: #477C9E;
    --blue-300: #759DB6;
    --blue-200: #A3BDCE;
    --blue-50: #E8EEF2;
    --ink: #171412;
    --charcoal: #3D3A37;
    --grey-600: #6B7280;
    --grey-400: #9CA3AF;
    --grey-200: #E5E7EB;
    --off-white: #FAF8F5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--off-white);
    color: var(--charcoal);
    min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; gap: 14px;
    padding: 16px 28px;
    background: var(--deep-navy);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  header a.logo-link { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
  header .logo-img { height: 30px; width: auto; display: block; }
  header .tool-label { color: var(--blue-200); font-size: 0.85rem; margin-left: 4px; letter-spacing: 0.3px; }
  .pdf-btn {
    margin-left: auto;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.3);
    color: #ffffff;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .pdf-btn:hover { background: rgba(255,255,255,0.1); }
  @media print { header { display: none; } }

  main { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 28px 24px 80px; }

  .product-select-wrap { display: flex; justify-content: center; margin-bottom: 22px; }
  select.product-select {
    background: #ffffff;
    border: 1px solid var(--grey-200);
    color: var(--ink);
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 0.95rem;
    min-width: 260px;
    font-family: inherit;
  }

  .tabbar {
    display: flex; gap: 6px; justify-content: center;
    margin-bottom: 30px; flex-wrap: wrap;
    border-bottom: 1px solid var(--grey-200);
    padding-bottom: 0;
  }
  .tabbtn {
    background: transparent; border: none; cursor: pointer;
    color: var(--grey-600); font-size: 0.95rem; font-weight: 600;
    padding: 12px 20px; border-bottom: 2px solid transparent;
    transition: all 0.2s;
    font-family: inherit;
  }
  .tabbtn:hover { color: var(--axiom-blue); }
  .tabbtn.active { color: var(--axiom-blue); border-bottom-color: var(--axiom-blue); }

  .tabpanel { display: none; animation: fadein 0.35s ease; }
  .tabpanel.active { display: block; }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .competitor-select-wrap { display: flex; justify-content: center; margin-bottom: 26px; }
  select.competitor-select {
    background: #ffffff;
    border: 1px solid var(--grey-200);
    color: var(--ink);
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 0.95rem;
    min-width: 320px;
    font-family: inherit;
  }

  .card {
    background: var(--off-white);
    border: 1px solid var(--grey-200);
    border-radius: 8px;
    padding: 24px 26px;
    margin-bottom: 20px;
  }
  .threat-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 14px; border-radius: 999px;
    font-size: 0.78rem; font-weight: 700; letter-spacing: 0.3px;
    margin-bottom: 14px;
  }
  .threat-high { background: var(--signal-amber); color: #ffffff; }
  .threat-med { background: var(--blue-200); color: var(--navy-900); }
  .threat-low { background: var(--grey-200); color: var(--charcoal); }

  .competitor-name { font-size: 1.6rem; font-weight: 300; margin: 0 0 14px; color: var(--ink); }
  .why-label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.6px; color: var(--signal-amber); font-weight: 700; margin-bottom: 8px; }
  .why-body { color: var(--charcoal); line-height: 1.6; font-size: 0.96rem; }

  .depos-card {
    border-left: 3px solid var(--signal-amber);
    background: #FDF6EE;
  }
  .depos-label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.6px; color: var(--signal-amber); font-weight: 700; margin-bottom: 12px; }
  .depos-claim { font-style: italic; color: var(--grey-600); margin-bottom: 12px; line-height: 1.55; }
  .depos-angle { color: var(--ink); font-weight: 400; line-height: 1.65; font-size: 0.98rem; }

  .section-header {
    font-size: 1.1rem; font-weight: 700; margin: 30px 0 12px;
    color: var(--ink);
  }

  table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
  .table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--grey-200); background: #ffffff; }
  th, td { padding: 12px 16px; text-align: left; font-size: 0.9rem; vertical-align: top; }
  thead th { background: var(--blue-50); font-weight: 700; color: var(--navy-900); white-space: nowrap; }
  tbody tr { border-top: 1px solid var(--grey-200); }
  tbody tr:nth-child(even) { background: #FBFAF8; }
  .col-yourproduct { border-left: 3px solid var(--axiom-blue); background: var(--blue-50); }
  th.col-yourproduct { border-left: 3px solid var(--axiom-blue); }
  .col-details { color: var(--grey-600); font-size: 0.85rem; }

  .dim-label { font-weight: 700; color: var(--ink); white-space: nowrap; background: #FBFAF8; position: sticky; left: 0; z-index: 2; }

  .dot-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 600; color: var(--charcoal); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot-high { background: var(--signal-amber); }
  .dot-med { background: var(--blue-300); }
  .dot-low { background: var(--grey-400); }

  .cat-row td {
    background: var(--blue-50);
    font-weight: 700; font-size: 0.78rem;
    text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--axiom-blue);
  }
  .symbol { text-align: center; font-size: 1.1rem; }
  .sym-full { color: var(--axiom-blue); }
  .sym-partial { color: var(--signal-amber); }
  .sym-none { color: var(--grey-400); }

  .legend { color: var(--grey-600); font-size: 0.85rem; margin-top: 12px; text-align: center; }

  .comp-section-title {
    font-size: 1.05rem; font-weight: 700; margin: 26px 0 10px;
    padding-bottom: 8px; border-bottom: 1px solid var(--grey-200);
    color: var(--ink);
  }

  @media (max-width: 700px) {
    header { padding: 14px 16px; }
    main { padding: 20px 12px 60px; }
    .card { padding: 18px; }
  }
</style>
</head>

m: freight audit, AP automation, spend intelligence"}, "Key Outcomes Claimed": {"your_product": "Better carrier selection, margin improvement, reliable automated reporting, early change detection", "Excel / Spreadsheets": "Familiarity, full control, no vendor cost", "Native TMS Analytics": "\"Good enough\" visibility already in the platform they pay for", "Power BI": "Flexible cross-system dashboards", "Tableau": "Polished visual analytics", "Enveyo": "Reduced shipping spend, carrier performance scorecards, cost-to-serve visibility", "Loop": "6%+ transportation savings via audit accuracy and spend visibility"}, "Core Capabilities": {"your_product": "Carrier scorecards by lane, data quality safeguards, Watch Cards/treemaps for change monitoring, automated QBRs (upcoming)", "Excel / Spreadsheets": "Pivot tables, manual formulas, tabs per lane/carrier", "Native TMS Analytics": "Standard reports/exports tied to the TMS data model", "Power BI": "Custom dashboards, wide data-source connectivity", "Tableau": "Custom dashboards, strong visualization layer", "Enveyo": "Data unification, carrier scorecards, modeling/simulation, rate shopping, audit", "Loop": "Data normalization, AI-driven freight audit, exception management, spend analytics"}, "Standout Feature": {"your_product": "AI data-quality safeguards that catch analysis mistakes (mixing modes, incomplete statuses) before they skew results", "Excel / Spreadsheets": "None \u2014 the default, not a feature", "Native TMS Analytics": "Already paid for as part of the TMS license", "Power BI": "Broad enterprise adoption/familiarity", "Tableau": "Best-in-class visualization aesthetics", "Enveyo": "\"Modeling\" \u2014 simulate carrier/network changes before committing", "Loop": "AI document extraction (DUX) that normalizes invoices/BOLs automatically"}, "Pricing Model": {"your_product": "Subscription, sized for growth-stage 3PLs/brokers", "Excel / Spreadsheets": "Sunk cost (Microsoft 365 license)", "Native TMS Analytics": "Bund  "Native TMS Analytics": "partial", "Power BI": "partial", "Tableau": "partial", "Enveyo": "full", "Loop": "partial"}, {"label": "Uses your own shipment data (not market averages)", "your_product": "full", "Excel / Spreadsheets": "full", "Native TMS Analytics": "full", "Power BI": "full", "Tableau": "full", "Enveyo": "full", "Loop": "full"}, {"label": "Multi-modal (TL/LTL) lane-level breakdown", "your_product": "full", "Excel / Spreadsheets": "partial", "Native TMS Analytics": "partial", "Power BI": "partial", "Tableau": "partial", "Enveyo": "partial", "Loop": "none"}]}, {"name": "Data Quality & Reliability", "features": [{"label": "AI data-quality safeguards (flags bad mixes/incomplete data)", "your_product": "full", "Excel / Spreadsheets": "none", "Native TMS Analytics": "none", "Power BI": "none", "Tableau": "none", "Enveyo": "partial", "Loop": "full"}, {"label": "Understands freight/TMS data model out of the box", "your_product": "full", "Excel / Spreadsheets": "none", "Native TMS Analytics": "full", "Power BI": "none", "Tableau": "none", "Enveyo": "partial", "Loop": "partial"}]}, {"name": "Reporting & Monitoring", "features": [{"label": "Automated, self-updating reports", "your_product": "full", "Excel / Spreadsheets": "none", "Native TMS Analytics": "partial", "Power BI": "full", "Tableau": "full", "Enveyo": "full", "Loop": "full"}, {"label": "Change/anomaly monitoring (e.g. missing customer, margin drop)", "your_product": "full", "Excel / Spreadsheets": "none", "Native TMS Analytics": "none", "Power BI": "partial", "Tableau": "partial", "Enveyo": "partial", "Loop": "partial"}, {"label": "Automated QBR generation", "your_product": "partial", "Excel / Spreadsheets": "none", "Native TMS Analytics": "none", "Power BI": "none", "Tableau": "none", "Enveyo": "none", "Loop": "none"}]}, {"name": "Adoption & Fit", "features": [{"label": "Usable without an analyst or data team", "your_product": "full", "Excel / Spreadsheets": "full", "Native TMS Analytics": "full", "Power BI": "none", "Tableau": "none", "Enveyo": "partial", "Loop": "partial"}, {"label": "Fast time-to-value (no deep integration)", "your_product": "full", "Excel / Spreadsheets": "full", "Native TMS Analytics": "full", "Power BI": "partial", "Tableau": "partial", "Enveyo": "none", "Loop": "none"}, {"label": "Right-sized for growth-stage 3PLs (vs. enterprise-only)", "your_product": "full", "Excel / Spreadsheets": "full", "Native TMS Analytics": "full", "Power BI": "partial", "Tableau": "partial", "Enveyo": "none", "Loop": "none"}]}, {"name": "Adjacent Capabilities", "features": [{"label": "Freight/parcel invoice audit", "your_product": "none", "Excel / Spreadsheets": "none", "Native TMS Analytics": "none", "Power BI": "none", "Tableau": "none", "Enveyo": "full", "Loop": "full"}, {"label": "Network/carrier-mix modeling & simulation", "your_product": "none", "Excel / Spreadsheets": "none", "Native TMS Analytics": "none", "Power BI": "partial", "Tableau": "partial", "Enveyo": "full", "Loop": "partial"}]}]}}};

let currentProduct = COMPETITIVE_DATA.products[0];

function init() {
  const products = COMPETITIVE_DATA.products;
  const productSelect = document.getElementById('productSelect');
  const productWrap = document.getElementById('productSelectWrap');
  if (products.length > 1) {
    productWrap.style.display = 'flex';
    products.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p; opt.textContent = p;
      productSelect.appendChild(opt);
    });
    productSelect.value = currentProduct;
    productSelect.addEventListener('change', () => {
      currentProduct = productSelect.value;
      renderAll();
    });
  }

  document.querySelectorAll('.tabbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tabbtn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tabpanel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  const competitorSelect = document.getElementById('competitorSelect');
  competitorSelect.addEventListener('change', renderTeardown);

  renderAll();
}

function renderAll() {
  populateCompetitorSelect();
  renderTeardown();
  renderComparison();
  renderCapabilities();
}

function populateCompetitorSelect() {
  const sel = document.getElementById('competitorSelect');
  sel.innerHTML = '';
  const allOpt = document.createElement('option');
  allOpt.value = 'ALL'; allOpt.textContent = 'ALL Competitors';
  sel.appendChild(allOpt);
  const comps = COMPETITIVE_DATA.competitors[currentProduct] || [];
  comps.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    sel.appendChild(opt);
  });
  sel.value = comps[0] || 'ALL';
}

function threatBadge(level) {
  const map = {
    high: ['▲ High Threat', 'threat-high'],
    med: ['● Med Threat', 'threat-med'],
    low: ['▼ Low Threat', 'threat-low']
  };
  const [label, cls] = map[level] || map.med;
  return `<span class="threat-badge ${cls}">${label}</span>`;
}

function renderIntelTable(product, competitor) {
  const rows = (COMPETITIVE_DATA.intel[product] && COMPETITIVE_DATA.intel[product][competitor]) || [];
  let html = `<div class="table-wrap"><table><thead><tr>
    <th>Capability / Feature / Benefit</th>
    <th class="col-yourproduct">${product}</th>
    <th>${competitor}</th>
    <th>More Details</th>
  </tr></thead><tbody>`;
  rows.forEach(r => {
    html += `<tr>
      <td>${r.capability}</td>
      <td class="col-yourproduct">${r.your_product}</td>
      <td>${r.competitor}</td>
      <td class="col-details">${r.details || ''}</td>
    </tr>`;
  });
  html += '</tbody></table></div>';
  return html;
}

function renderTeardown() {
  const sel = document.getElementById('competitorSelect').value;
  const container = document.getElementById('teardownContent');
  const product = currentProduct;
  let html = '';

  if (sel === 'ALL') {
    const comps = COMPETITIVE_DATA.competitors[product] || [];
    comps.forEach(c => {
      html += `<div class="comp-section-title">${c}</div>`;
      html += renderIntelTable(product, c);
    });
  } else {
    const threat = (COMPETITIVE_DATA.threatLevel[product] || {})[sel];
    const why = (COMPETITIVE_DATA.whyItMatters[product] || {})[sel];
    html += `<div class="card">
      ${threatBadge(threat)}
      <h3 class="competitor-name">${sel}</h3>
      <div class="why-label">Why They Matter</div>
      <div class="why-body">${why || ''}</div>
    </div>`;

    const depos = COMPETITIVE_DATA.dePosition && COMPETITIVE_DATA.dePosition[product] && COMPETITIVE_DATA.dePosition[product][sel];
    if (depos) {
      html += `<div class="card depos-card">
        <div class="depos-label">De-Positioning Angle</div>
        <div class="depos-claim">They say: "${depos.their_claim}"</div>
        <div class="depos-angle">${depos.the_angle}</div>
      </div>`;
    }

    html += renderIntelTable(product, sel);
  }

  container.innerHTML = html;
}

function threatDot(level) {
  const map = { high: ['dot-high', 'High'], med: ['dot-med', 'Moderate'], low: ['dot-low', 'Low'] };
  const [cls, label] = map[level] || ['dot-low', 'Watch'];
  return `<span class="dot-badge"><span class="dot ${cls}"></span>${label}</span>`;
}

function renderComparison() {
  const product = currentProduct;
  const compData = COMPETITIVE_DATA.comparison[product];
  const container = document.getElementById('comparisonContent');
  if (!compData) { container.innerHTML = ''; return; }
  const competitors = COMPETITIVE_DATA.competitors[product] || [];

  let html = `<div class="table-wrap"><table><thead><tr>
    <th class="dim-label">Dimension</th>
    <th class="col-yourproduct">${product}</th>`;
  competitors.forEach(c => { html += `<th>${c}</th>`; });
  html += '</tr></thead><tbody>';

  compData.dimensions.forEach(dim => {
    const row = compData.rows[dim] || {};
    html += `<tr><td class="dim-label">${dim}</td>`;
    if (dim === 'Threat Tier') {
      html += `<td class="col-yourproduct">—</td>`;
      competitors.forEach(c => {
        html += `<td>${threatDot(row[c])}</td>`;
      });
    } else {
      html += `<td class="col-yourproduct">${row.your_product || ''}</td>`;
      competitors.forEach(c => {
        html += `<td>${row[c] || ''}</td>`;
      });
    }
    html += '</tr>';
  });

  html += '</tbody></table></div>';
  container.innerHTML = html;
}

function symbolCell(val) {
  const map = { full: ['✓', 'sym-full'], partial: ['◐', 'sym-partial'], none: ['✕', 'sym-none'] };
  const [sym, cls] = map[val] || ['', ''];
  return `<td class="symbol ${cls}">${sym}</td>`;
}

function renderCapabilities() {
  const product = currentProduct;
  const capData = COMPETITIVE_DATA.capabilities[product];
  const container = document.getElementById('capabilitiesContent');
  if (!capData) { container.innerHTML = ''; return; }
  const competitors = capData.competitors;

  let html = `<div class="table-wrap"><table><thead><tr>
    <th>Feature</th>
    <th class="col-yourproduct">${product}</th>`;
  competitors.forEach(c => { html += `<th>${c}</th>`; });
  html += '</tr></thead><tbody>';

  capData.categories.forEach(cat => {
    html += `<tr class="cat-row"><td colspan="${2 + competitors.length}">${cat.name}</td></tr>`;
    cat.features.forEach(f => {
      html += `<tr><td>${f.label}</td>`;
      const ypMap = { full: ['✓', 'sym-full'], partial: ['◐', 'sym-partial'], none: ['✕', 'sym-none'] };
      const [ypSym, ypCls] = ypMap[f.your_product] || ['', ''];
      html += `<td class="col-yourproduct symbol ${ypCls}">${ypSym}</td>`;
      competitors.forEach(c => {
        html += symbolCell(f[c]);
      });
      html += '</tr>';
    });
  });

  html += '</tbody></table></div>';
  html += `<div class="legend">✓ Full support &nbsp;·&nbsp; ◐ Partial / manual workaround &nbsp;·&nbsp; ✕ Not supported</div>`;
  container.innerHTML = html;
}

init();
</script>
</body>
</html>
